name: Azure SSH Test

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.AZURE_SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key

      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/azure_key \
            ${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }} \
            "hostname"
