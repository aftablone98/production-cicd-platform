name: CI

on:
  push:
    branches:
      - main


  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write



jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit


      - name: Run Ruff
        run: ruff check .

      - name: Security Audit
        run: pip-audit

      - name: Run tests
        run: pytest


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/aftablone98/production-cicd-platform:latest \
            -t ghcr.io/aftablone98/production-cicd-platform:${{ github.sha }} \
            .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/aftablone98/production-cicd-platform:latest
          docker push ghcr.io/aftablone98/production-cicd-platform:${{ github.sha }}
