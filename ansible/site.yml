---
- name: Configure Production CI/CD Azure VM
  hosts: web
  become: true

  vars:
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
    app_image: "{{ lookup('env', 'APP_IMAGE') }}"

  tasks:
    - name: Log in to GitHub Container Registry
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
        reauthorize: true
      no_log: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Pull application image
      community.docker.docker_image:
        name: "{{ app_image }}"
        source: pull

    - name: Stop existing application container
      community.docker.docker_container:
        name: production-cicd-app
        state: absent

    - name: Start application container
      community.docker.docker_container:
        name: production-cicd-app
        image: "{{ app_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "80:5000"
